<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS v6 Mobile</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>

<div class="background"></div>

<div class="container">

    <h1 class="title">AI Assistant v6.0</h1>

    <div class="core">
        <div class="wave"></div>
        <div class="ring"></div>
        <div class="inner-core"></div>

        <!-- Waveform bars -->
        <div class="waveform">
            <div class="bar" style="--i:0"></div>
            <div class="bar" style="--i:1"></div>
            <div class="bar" style="--i:2"></div>
            <div class="bar" style="--i:3"></div>
            <div class="bar" style="--i:4"></div>
            <div class="bar" style="--i:5"></div>
            <div class="bar" style="--i:6"></div>
            <div class="bar" style="--i:7"></div>
        </div>
    </div>

    <div class="status" id="status">
        <!-- Typing animation will appear here -->
    </div>

    <div class="controls">
<div class="icon mic" id="mic"></div>
        <div class="icon power">⚡</div>
        <div class="icon settings">⚙</div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
